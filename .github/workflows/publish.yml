on:
  push:
    tags:
      - "*"

name: Deploy Extension
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The Visual Studio Marketplace authenticates the workflow with its OpenID Connect token
      id-token: write
    env:
      # A tag with a suffix (2.4.0-alpha.1) publishes the version of package.json as a pre-release
      PRE_RELEASE: ${{ contains(github.ref_name, '-') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # vsce 4 needs Node 22
          node-version: 22
      - run: npm ci
      - name: Publish to Open VSX Registry
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ secrets.OPEN_VSX_TOKEN }}
          preRelease: ${{ env.PRE_RELEASE == 'true' }}
          # Publishing again a tag only completes the registries that miss its version
          skipDuplicate: true
      - name: Publish to Visual Studio Marketplace
        run: npx --yes @vscode/vsce@4.1.0 publish --oidc --skip-duplicate ${{ env.PRE_RELEASE == 'true' && '--pre-release' || '' }}
